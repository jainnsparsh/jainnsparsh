<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-labelledby="uni-t uni-d">
  <title id="uni-t">Technology universe</title>
  <desc id="uni-d">A hub-and-spoke map with Sparsh at the centre and six domains around it. Software Engineering and Design and Creativity have solid outlines, meaning they appear in public repositories. AI and Machine Learning, Systems and Linux, Networking, and Electronics and Embedded Systems have dashed outlines, meaning hands-on exploration.</desc>
  <defs>
    <linearGradient id="u-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e151e"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <pattern id="u-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a2431"/>
    </pattern>
    <radialGradient id="u-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ee6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3ee6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="u-card"><rect width="800" height="470" rx="14"/></clipPath>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .ttl { font-size: 14px; font-weight: 700; fill: #e6edf3; text-anchor: middle; }
      .sub { font-size: 11px; fill: #7d8b99; text-anchor: middle; }
      .node { fill: #0f1620; stroke-width: 1.5; }
      .solid { stroke: #3ee6ff; }
      .dash { stroke: #3b4a5c; stroke-dasharray: 5 4; }
      .spoke-solid { stroke: #3ee6ff; stroke-opacity: .55; stroke-width: 1.5; fill: none; }
      .spoke-dash { stroke: #3ee6ff; stroke-opacity: .3; stroke-width: 1.5; fill: none; stroke-dasharray: 3 7; animation: flow 3.5s linear infinite; }
      .ring { fill: none; stroke: #1f2a37; stroke-width: 1; stroke-dasharray: 2 6; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 400px 230px; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#u-card)">
    <rect width="800" height="470" fill="url(#u-bg)"/>
    <rect width="800" height="470" fill="url(#u-dots)"/>
    <circle cx="400" cy="230" r="150" fill="url(#u-glow)"/>
    <ellipse cx="400" cy="230" rx="300" ry="150" class="ring"/>

    <!-- spokes (drawn under nodes) -->
    <line x1="400" y1="230" x2="400" y2="108" class="spoke-solid"/>
    <path d="M400 230L555 155" class="spoke-dash"/>
    <path d="M400 230L555 305" class="spoke-dash"/>
    <path d="M400 230V352" class="spoke-dash"/>
    <path d="M400 230L245 305" class="spoke-dash"/>
    <path d="M400 230L245 155" class="spoke-solid"/>

    <!-- centre -->
    <g>
      <circle class="pulse" cx="400" cy="230" r="52" fill="none" stroke="#3ee6ff" stroke-opacity="0.25"/>
      <circle cx="400" cy="230" r="40" fill="#0b1118" stroke="#3ee6ff" stroke-width="1.5"/>
      <text class="m" x="400" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#3ee6ff">SJ</text>
      <text class="m" x="400" y="244" text-anchor="middle" font-size="10" fill="#7d8b99">curious</text>
    </g>

    <!-- nodes: 210 x 60 -->
    <g class="m">
      <!-- top: Software Engineering (solid) -->
      <rect class="node solid" x="295" y="48" width="210" height="60" rx="10"/>
      <text class="ttl" x="400" y="74">Software Engineering</text>
      <text class="sub" x="400" y="94">FastAPI · React · TypeScript</text>

      <!-- upper right: AI & ML (dashed) -->
      <rect class="node dash" x="555" y="125" width="210" height="60" rx="10"/>
      <text class="ttl" x="660" y="151">AI &amp; Machine Learning</text>
      <text class="sub" x="660" y="171">LLMs · local inference</text>

      <!-- lower right: Systems & Linux (dashed) -->
      <rect class="node dash" x="555" y="275" width="210" height="60" rx="10"/>
      <text class="ttl" x="660" y="301">Systems &amp; Linux</text>
      <text class="sub" x="660" y="321">Linux · OS · open source</text>

      <!-- bottom: Networking (dashed) -->
      <rect class="node dash" x="295" y="352" width="210" height="60" rx="10"/>
      <text class="ttl" x="400" y="378">Networking</text>
      <text class="sub" x="400" y="398">OpenWrt · router firmware</text>

      <!-- lower left: Electronics (dashed) -->
      <rect class="node dash" x="35" y="275" width="210" height="60" rx="10"/>
      <text class="ttl" x="140" y="301">Electronics &amp; Embedded</text>
      <text class="sub" x="140" y="321">Arduino · digital logic</text>

      <!-- upper left: Design (solid) -->
      <rect class="node solid" x="35" y="125" width="210" height="60" rx="10"/>
      <text class="ttl" x="140" y="151">Design &amp; Creativity</text>
      <text class="sub" x="140" y="171">UI/UX · graphic design</text>
    </g>

    <!-- legend -->
    <g class="m" font-size="11" fill="#7d8b99">
      <rect x="40" y="441" width="18" height="10" rx="3" fill="#0f1620" stroke="#3ee6ff" stroke-width="1.5"/>
      <text x="66" y="450">visible in public repos</text>
      <rect x="250" y="441" width="18" height="10" rx="3" fill="#0f1620" stroke="#3b4a5c" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="276" y="450">hands-on exploration</text>
      <text x="760" y="450" text-anchor="end">fig. 1 — technology universe</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="798.5" height="468.5" rx="13.5" fill="none" stroke="#1f2a37" stroke-width="1.5"/>
</svg>
