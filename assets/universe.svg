<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="uni-t uni-d">
  <title id="uni-t">Sparsh Jain — Cross-Layer Engineering Universe</title>
  <desc id="uni-d">Interactive hub-and-spoke architecture map displaying 6 domains spanning software, security, AI, systems, networking, and silicon.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="u-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="50%" stop-color="#0b1018"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>

    <!-- Dot Matrix -->
    <pattern id="u-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#182332" fill-opacity="0.5"/>
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="u-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee6ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3ee6ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="u-card">
      <rect width="800" height="480" rx="14"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .ttl { font-size: 13px; font-weight: 700; fill: #f1f5f9; text-anchor: middle; }
      .sub { font-size: 11px; fill: #8da2ba; text-anchor: middle; }
      .node-card { fill: #0d141e; stroke-width: 1.5; }
      .solid-border { stroke: #3ee6ff; }
      .dash-border { stroke: #334860; stroke-dasharray: 5 4; }
      .spoke-solid { stroke: #3ee6ff; stroke-opacity: 0.6; stroke-width: 1.5; fill: none; }
      .spoke-dash { stroke: #3ee6ff; stroke-opacity: 0.35; stroke-width: 1.5; fill: none; stroke-dasharray: 4 6; animation: flow 3s linear infinite; }
      .orbital-ring { fill: none; stroke: #1e2c3e; stroke-width: 1.2; stroke-dasharray: 3 7; }
      .core-pulse { animation: corePulse 3s ease-in-out infinite; transform-origin: 400px 235px; }

      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes corePulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#u-card)">
    <!-- Base Background -->
    <rect width="800" height="480" fill="url(#u-bg)"/>
    <rect width="800" height="480" fill="url(#u-dots)"/>

    <!-- Central Core Ambient Aura -->
    <circle cx="400" cy="235" r="160" fill="url(#u-core-glow)"/>

    <!-- Orbital Trajectory Rings -->
    <ellipse cx="400" cy="235" rx="310" ry="155" class="orbital-ring"/>
    <ellipse cx="400" cy="235" rx="220" ry="110" stroke="#162232" stroke-width="1" fill="none" stroke-dasharray="2 6"/>

    <!-- Spoke Connections (Under Nodes) -->
    <!-- Top: Software Engineering -->
    <path id="spoke-top" d="M400 235 L400 112" class="spoke-solid"/>
    <!-- Upper Right: AI & ML -->
    <path id="spoke-ur" d="M400 235 L555 160" class="spoke-dash"/>
    <!-- Lower Right: Systems & Linux -->
    <path id="spoke-lr" d="M400 235 L555 310" class="spoke-dash"/>
    <!-- Bottom: Networking -->
    <path id="spoke-bot" d="M400 235 L400 358" class="spoke-dash"/>
    <!-- Lower Left: Electronics -->
    <path id="spoke-ll" d="M400 235 L245 310" class="spoke-dash"/>
    <!-- Upper Left: Design & UI/UX -->
    <path id="spoke-ul" d="M400 235 L245 160" class="spoke-solid"/>

    <!-- Animated Data Pulses moving along spokes -->
    <circle r="3" fill="#00f5a0">
      <animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#spoke-top"/></animateMotion>
    </circle>
    <circle r="2.5" fill="#3ee6ff">
      <animateMotion dur="3.6s" repeatCount="indefinite" begin="0.8s"><mpath href="#spoke-ur"/></animateMotion>
    </circle>
    <circle r="2.5" fill="#3ee6ff">
      <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.4s"><mpath href="#spoke-lr"/></animateMotion>
    </circle>
    <circle r="2.5" fill="#3ee6ff">
      <animateMotion dur="4s" repeatCount="indefinite" begin="0.4s"><mpath href="#spoke-bot"/></animateMotion>
    </circle>
    <circle r="2.5" fill="#3ee6ff">
      <animateMotion dur="3.4s" repeatCount="indefinite" begin="1.1s"><mpath href="#spoke-ll"/></animateMotion>
    </circle>
    <circle r="3" fill="#00f5a0">
      <animateMotion dur="3s" repeatCount="indefinite" begin="0.2s"><mpath href="#spoke-ul"/></animateMotion>
    </circle>

    <!-- CENTER HUB (Sparsh / Lab Core) -->
    <g>
      <circle class="core-pulse" cx="400" cy="235" r="54" fill="none" stroke="#3ee6ff" stroke-width="1.5"/>
      <circle cx="400" cy="235" r="42" fill="#0a1017" stroke="#3ee6ff" stroke-width="2"/>
      <circle cx="400" cy="235" r="32" fill="#06090e" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.8"/>
      <text class="mono" x="400" y="231" text-anchor="middle" font-size="22" font-weight="800" fill="#3ee6ff">SJ</text>
      <text class="mono" x="400" y="248" text-anchor="middle" font-size="9" font-weight="600" fill="#00f5a0" letter-spacing="1">NEXUS</text>
    </g>

    <!-- NODES (Width: 215, Height: 62) -->
    <g class="mono">
      <!-- 1. TOP: Software Engineering (SOLID / REPOS) -->
      <g transform="translate(292, 50)">
        <rect class="node-card solid-border" width="216" height="62" rx="10"/>
        <rect x="0" y="10" width="3.5" height="42" rx="1.5" fill="#3ee6ff"/>
        <circle cx="20" cy="24" r="3.5" fill="#3ee6ff"/>
        <text class="ttl" x="115" y="27">Software Engineering</text>
        <text class="sub" x="115" y="47">FastAPI · React · TypeScript · Vite</text>
      </g>

      <!-- 2. UPPER RIGHT: AI & Machine Learning (DASH / EXPLORING) -->
      <g transform="translate(550, 128)">
        <rect class="node-card dash-border" width="216" height="62" rx="10"/>
        <rect x="0" y="10" width="3.5" height="42" rx="1.5" fill="#a855f7"/>
        <circle cx="20" cy="24" r="3.5" fill="#a855f7"/>
        <text class="ttl" x="115" y="27">AI &amp; Machine Learning</text>
        <text class="sub" x="115" y="47">Local LLMs · GGUF Quantization</text>
      </g>

      <!-- 3. LOWER RIGHT: Systems & Linux (DASH / EXPLORING) -->
      <g transform="translate(550, 278)">
        <rect class="node-card dash-border" width="216" height="62" rx="10"/>
        <rect x="0" y="10" width="3.5" height="42" rx="1.5" fill="#f59e0b"/>
        <circle cx="20" cy="24" r="3.5" fill="#f59e0b"/>
        <text class="ttl" x="115" y="27">Systems &amp; Linux</text>
        <text class="sub" x="115" y="47">Kernel Tuning · OS · Shell Tooling</text>
      </g>

      <!-- 4. BOTTOM: Networking & Firmware (DASH / EXPLORING) -->
      <g transform="translate(292, 358)">
        <rect class="node-card dash-border" width="216" height="62" rx="10"/>
        <rect x="0" y="10" width="3.5" height="42" rx="1.5" fill="#60a5fa"/>
        <circle cx="20" cy="24" r="3.5" fill="#60a5fa"/>
        <text class="ttl" x="115" y="27">Networking &amp; Firmware</text>
        <text class="sub" x="115" y="47">OpenWrt · Radio Specs · Packets</text>
      </g>

      <!-- 5. LOWER LEFT: Electronics & Silicon (DASH / EXPLORING) -->
      <g transform="translate(34, 278)">
        <rect class="node-card dash-border" width="216" height="62" rx="10"/>
        <rect x="0" y="10" width="3.5" height="42" rx="1.5" fill="#00f5a0"/>
        <circle cx="20" cy="24" r="3.5" fill="#00f5a0"/>
        <text class="ttl" x="115" y="27">Electronics &amp; Silicon</text>
        <text class="sub" x="115" y="47">Arduino · 7400 TTL · Digital Logic</text>
      </g>

      <!-- 6. UPPER LEFT: Design & Security (SOLID / REPOS) -->
      <g transform="translate(34, 128)">
        <rect class="node-card solid-border" width="216" height="62" rx="10"/>
        <rect x="0" y="10" width="3.5" height="42" rx="1.5" fill="#3ee6ff"/>
        <circle cx="20" cy="24" r="3.5" fill="#3ee6ff"/>
        <text class="ttl" x="115" y="27">Security &amp; UI Design</text>
        <text class="sub" x="115" y="47">Permission Auditing · Figma · UX</text>
      </g>
    </g>

    <!-- Bottom Legend -->
    <g class="mono" font-size="11" fill="#718295">
      <!-- Legend Item 1 -->
      <rect x="40" y="450" width="18" height="10" rx="3" fill="#0d141e" stroke="#3ee6ff" stroke-width="1.5"/>
      <text x="66" y="459">Shipped in Public Repos</text>

      <!-- Legend Item 2 -->
      <rect x="260" y="450" width="18" height="10" rx="3" fill="#0d141e" stroke="#334860" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="286" y="459">Hands-on Laboratory Research</text>

      <text x="760" y="459" text-anchor="end" fill="#526477">MAP REF: TECH-ORBIT-V2</text>
    </g>
  </g>

  <!-- Outer Glass Border -->
  <rect x="0.75" y="0.75" width="798.5" height="478.5" rx="13.5" fill="none" stroke="#1f2c3f" stroke-width="1.5"/>
</svg>
