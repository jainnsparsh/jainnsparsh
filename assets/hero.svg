<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sparsh Jain — Systems &amp; Security Engineering Laboratory</title>
  <desc id="hero-desc">Dark-mode cyber terminal window with whoami, SPARSH JAIN, animated silicon chip and system telemetry.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e"/>
      <stop offset="50%" stop-color="#0b1119"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4f6ff"/>
      <stop offset="75%" stop-color="#3ee6ff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ee6ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3ee6ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111925"/>
      <stop offset="100%" stop-color="#0a0f17"/>
    </linearGradient>

    <!-- Dot Matrix Pattern -->
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#1d293a" fill-opacity="0.6"/>
    </pattern>

    <clipPath id="terminal-card">
      <rect width="800" height="340" rx="14"/>
    </clipPath>

    <!-- Typing Mask with ample width so text is NEVER clipped -->
    <clipPath id="typing-mask">
      <rect class="typeclip" x="40" y="166" width="650" height="36"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .text-muted { fill: #64748b; }
      .text-soft { fill: #cbd5e1; }
      .text-cyan { fill: #3ee6ff; }
      .text-green { fill: #00f5a0; }
      .text-violet { fill: #a855f7; }

      .anim-fade1 { animation: fadeIn .6s ease-out .1s backwards; }
      .anim-fade2 { animation: fadeIn .6s ease-out .35s backwards; }
      .anim-fade3 { animation: fadeIn .6s ease-out 2.2s backwards; }
      .typeclip { animation: typeText 1.8s steps(48) .6s backwards; }
      .term-cursor { animation: blinkCursor 1.05s steps(2, start) 2.5s infinite backwards; }
      .live-ping { animation: pulseGlow 2.4s ease-in-out infinite; }
      .chip-pulse { animation: chipCore 3s ease-in-out infinite; }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes typeText { from { width: 0; } }
      @keyframes blinkCursor { 0% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes chipCore { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Container -->
  <g clip-path="url(#terminal-card)">
    <rect width="800" height="340" fill="url(#bg-grad)"/>
    <rect width="800" height="340" fill="url(#grid-dots)"/>

    <!-- Subtle Ambient Glow in Corner -->
    <circle cx="700" cy="130" r="160" fill="#3ee6ff" fill-opacity="0.04"/>
    <circle cx="150" cy="220" r="180" fill="#00f5a0" fill-opacity="0.02"/>

    <!-- Terminal Window Top Bar -->
    <rect width="800" height="42" fill="#0b1118"/>
    <line x1="0" y1="42" x2="800" y2="42" stroke="#1c2838" stroke-width="1"/>
    <line x1="0" y1="43" x2="360" y2="43" stroke="url(#accent-cyan)" stroke-width="1.5"/>

    <!-- macOS Window Buttons -->
    <circle cx="24" cy="21" r="5" fill="#ff5f56" fill-opacity="0.85"/>
    <circle cx="44" cy="21" r="5" fill="#ffbd2e" fill-opacity="0.85"/>
    <circle cx="64" cy="21" r="5" fill="#27c93f" fill-opacity="0.85"/>

    <!-- Window Title -->
    <g class="mono" font-size="12">
      <text class="text-muted" x="400" y="26" text-anchor="middle">sparsh@quantum-node: ~/workspace/laboratory</text>
    </g>

    <!-- System Status Badge -->
    <g class="mono" font-size="11">
      <rect x="668" y="11" width="108" height="20" rx="10" fill="#070c12" stroke="#1c2838" stroke-width="1"/>
      <circle class="live-ping" cx="682" cy="21" r="3.5" fill="#00f5a0"/>
      <text x="694" y="25" fill="#00f5a0" font-weight="600" letter-spacing="0.5">NOMINAL</text>
    </g>

    <!-- Terminal Prompt Line 1 -->
    <g class="mono anim-fade1" font-size="14">
      <text x="40" y="86">
        <tspan class="text-cyan" font-weight="700">sparsh@lab</tspan><tspan class="text-muted">:</tspan><tspan class="text-green">~</tspan><tspan class="text-muted">$</tspan>
        <tspan fill="#e2e8f0" dx="8">whoami --verbose --stack=all-layers</tspan>
      </text>
    </g>

    <!-- Main Name Title - Crisp and High-Contrast -->
    <g class="mono anim-fade2">
      <text x="40" y="150" font-size="54" font-weight="800" fill="url(#name-grad)" letter-spacing="1.5">SPARSH JAIN</text>
    </g>

    <!-- Typing Subtitle with Unclipped Width -->
    <g clip-path="url(#typing-mask)">
      <text class="mono text-soft" x="40" y="190" font-size="20" font-weight="500">
        Understand it. Take it apart. Build it better.
      </text>
    </g>

    <!-- Tag Chips / Badges Row -->
    <g class="mono anim-fade3" font-size="11">
      <!-- Chip 1 -->
      <rect x="40" y="214" width="95" height="22" rx="4" fill="#0e1622" stroke="#223246" stroke-width="1"/>
      <text class="text-cyan" x="48" y="229" font-weight="600">B.TECH CSE</text>

      <!-- Chip 2 -->
      <rect x="143" y="214" width="130" height="22" rx="4" fill="#0e1622" stroke="#223246" stroke-width="1"/>
      <text class="text-green" x="151" y="229" font-weight="600">SECURITY TOOLING</text>

      <!-- Chip 3 -->
      <rect x="281" y="214" width="85" height="22" rx="4" fill="#0e1622" stroke="#223246" stroke-width="1"/>
      <text class="text-violet" x="289" y="229" font-weight="600">LOCAL AI</text>

      <!-- Chip 4 -->
      <rect x="374" y="214" width="138" height="22" rx="4" fill="#0e1622" stroke="#223246" stroke-width="1"/>
      <text class="text-soft" x="382" y="229" font-weight="600">SYSTEMS &amp; SILICON</text>
    </g>

    <!-- Terminal Prompt Line 2 -->
    <g class="mono" font-size="14">
      <text x="40" y="278">
        <tspan class="text-cyan" font-weight="700">~/lab</tspan><tspan class="text-muted">$</tspan>
        <tspan fill="#e2e8f0" dx="8">./keep-tinkering.sh</tspan>
      </text>
      <!-- Blinking Cursor -->
      <rect class="term-cursor" x="252" y="264" width="9" height="17" fill="#3ee6ff"/>
    </g>

    <!-- Microchip / Circuit Schematic (Right Column) -->
    <g transform="translate(620, 68)">
      <!-- Traces Background -->
      <g stroke="#3ee6ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Input Traces Left -->
        <path d="M-60 25 H-20" stroke-opacity="0.35"/>
        <path d="M-90 55 H-20" stroke-opacity="0.45"/>
        <path d="M-60 85 H-20" stroke-opacity="0.35"/>
        <path d="M-80 115 H-20" stroke-opacity="0.4"/>
        <path d="M-90 55 L-110 35 H-140" stroke-opacity="0.3"/>
        <path d="M-80 115 L-100 135 H-130" stroke-opacity="0.25"/>

        <!-- Output Traces Right -->
        <path d="M120 25 H150" stroke-opacity="0.35"/>
        <path d="M120 55 H165" stroke-opacity="0.45"/>
        <path d="M120 85 H150" stroke-opacity="0.35"/>
        <path d="M120 115 H160" stroke-opacity="0.3"/>
        <path d="M165 55 L180 40 V15" stroke-opacity="0.25"/>
        <path d="M160 115 L175 130 V150" stroke-opacity="0.25"/>

        <!-- Top / Bottom Pins -->
        <path d="M25 -15 V0" stroke-opacity="0.5"/>
        <path d="M50 -15 V0" stroke-opacity="0.5"/>
        <path d="M75 -15 V0" stroke-opacity="0.5"/>
        <path d="M25 140 V155" stroke-opacity="0.5"/>
        <path d="M50 140 V155" stroke-opacity="0.5"/>
        <path d="M75 140 V155" stroke-opacity="0.5"/>
      </g>

      <!-- Pin Nodes -->
      <g fill="#3ee6ff">
        <circle cx="-140" cy="35" r="2.5" fill-opacity="0.6"/>
        <circle cx="-130" cy="135" r="2.5" fill-opacity="0.6"/>
        <circle cx="180" cy="15" r="2.5" fill-opacity="0.6"/>
        <circle cx="175" cy="150" r="2.5" fill-opacity="0.6"/>
      </g>

      <!-- Chip Package -->
      <rect x="-10" y="5" width="120" height="130" rx="8" fill="url(#chip-grad)" stroke="#3ee6ff" stroke-width="1.8" stroke-opacity="0.85"/>
      <rect x="0" y="15" width="100" height="110" rx="4" fill="#080d14" stroke="#1c2838" stroke-width="1"/>

      <!-- Silicon Core Die -->
      <rect class="chip-pulse" x="18" y="33" width="64" height="64" rx="4" fill="#0c1420" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.9"/>

      <!-- Center Logo & Micro Labels -->
      <text class="mono text-cyan" x="50" y="68" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">SJ</text>
      <text class="mono text-muted" x="50" y="84" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1.5">CORE-X86</text>

      <!-- Corner Alignment Dots on Silicon -->
      <circle cx="26" cy="41" r="1.5" fill="#3ee6ff" fill-opacity="0.7"/>
      <circle cx="74" cy="41" r="1.5" fill="#3ee6ff" fill-opacity="0.7"/>
      <circle cx="26" cy="89" r="1.5" fill="#3ee6ff" fill-opacity="0.7"/>
      <circle cx="74" cy="89" r="1.5" fill="#3ee6ff" fill-opacity="0.7"/>

      <!-- Pin Labels -->
      <g class="mono" font-size="7" fill="#64748b" font-weight="600">
        <text x="-4" y="28">CLK</text>
        <text x="-4" y="58">INT</text>
        <text x="-4" y="88">RX</text>
        <text x="-4" y="118">TX</text>
        <text x="104" y="28" text-anchor="end">VCC</text>
        <text x="104" y="58" text-anchor="end">GND</text>
        <text x="104" y="88" text-anchor="end">BUS</text>
        <text x="104" y="118" text-anchor="end">ACK</text>
      </g>
    </g>

    <!-- Animated Travelling Electron Pulses -->
    <path id="electron-path-1" d="M480 123 H595 L610 123" stroke="#3ee6ff" stroke-opacity="0.3" stroke-width="1" fill="none"/>
    <circle r="2.5" fill="#00f5a0">
      <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.5s">
        <mpath href="#electron-path-1"/>
      </animateMotion>
    </circle>

    <path id="electron-path-2" d="M530 312 H680 L700 292 H792" stroke="#3ee6ff" stroke-opacity="0.25" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <circle r="3" fill="#3ee6ff">
      <animateMotion dur="4.5s" repeatCount="indefinite" begin="1.5s">
        <mpath href="#electron-path-2"/>
      </animateMotion>
    </circle>

    <!-- Bottom Status Telemetry Line -->
    <g class="mono" font-size="10" fill="#4d5f73">
      <text x="40" y="320">
        <tspan fill="#3ee6ff">SYSTEM:</tspan> READY  ·  <tspan fill="#3ee6ff">ENV:</tspan> HYPERVISOR  ·  <tspan fill="#00f5a0">PHILOSOPHY:</tspan> ZERO BLACK BOXES  ·  <tspan fill="#a855f7">UPTIME:</tspan> 99.99%
      </text>
    </g>
  </g>

  <!-- Outer Glass Border -->
  <rect x="0.75" y="0.75" width="798.5" height="338.5" rx="13.5" fill="none" stroke="#1c2838" stroke-width="1.5"/>
</svg>
