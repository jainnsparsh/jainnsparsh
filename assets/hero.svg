<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="hero-t hero-d">
  <title id="hero-t">Sparsh Jain — Engineering Laboratory</title>
  <desc id="hero-d">Cyberpunk terminal with matrix rain, glitch effects, animated chip, and typing animation.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="50%" stop-color="#0a0f18"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="nm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#c5f0ff"/>
      <stop offset="60%" stop-color="#3ee6ff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="ac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ee6ff" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#00f5a0" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <pattern id="gd" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#1a2533" fill-opacity=".5"/>
    </pattern>
    <filter id="gl" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cc"><rect width="800" height="340" rx="14"/></clipPath>
    <clipPath id="tm"><rect class="tc" x="40" y="168" width="480" height="34"/></clipPath>

    <style>
      .m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
      /* Matrix rain columns — staggered falling characters */
      .mr{fill:#3ee6ff;font-size:11px;opacity:0}
      .mr1{animation:rain 4s linear .2s infinite}.mr2{animation:rain 3.5s linear .8s infinite}
      .mr3{animation:rain 5s linear .1s infinite}.mr4{animation:rain 3.8s linear 1.2s infinite}
      .mr5{animation:rain 4.5s linear .5s infinite}.mr6{animation:rain 3.2s linear .9s infinite}
      .mr7{animation:rain 4.2s linear .3s infinite}.mr8{animation:rain 3.6s linear 1.5s infinite}
      .mr9{animation:rain 5.5s linear .7s infinite}.mr10{animation:rain 3.9s linear 1s infinite}
      .mr11{animation:rain 4.8s linear .4s infinite}.mr12{animation:rain 3.4s linear 1.3s infinite}
      /* Scanline overlay */
      .sl{animation:scan 8s linear infinite}
      /* Name glitch */
      .ng{animation:glitch 4s infinite}
      /* Typed subtitle */
      .tc{animation:type 2s steps(46) .7s backwards}
      /* Blinking cursor */
      .cu{animation:blink 1.1s steps(2,start) 2.8s infinite backwards}
      /* Live dot */
      .lp{animation:pulse 2s ease-in-out infinite}
      /* Chip core */
      .cp{animation:cPulse 3s ease-in-out infinite}
      /* Fade ins */
      .f1{animation:fadeUp .5s ease-out .1s backwards}
      .f2{animation:fadeUp .5s ease-out .3s backwards}
      .f3{animation:fadeUp .5s ease-out 2.2s backwards}

      @keyframes rain{0%{opacity:0;transform:translateY(-30px)}10%{opacity:.6}90%{opacity:.3}100%{opacity:0;transform:translateY(340px)}}
      @keyframes scan{0%{transform:translateY(-340px)}100%{transform:translateY(340px)}}
      @keyframes glitch{0%,92%,100%{transform:translate(0)}93%{transform:translate(-3px,1px)}95%{transform:translate(2px,-1px)}97%{transform:translate(-1px,2px)}}
      @keyframes type{from{width:0}}
      @keyframes blink{0%{opacity:1}50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.3;filter:none}50%{opacity:1;filter:drop-shadow(0 0 6px #00f5a0)}}
      @keyframes cPulse{0%,100%{opacity:.7;filter:none}50%{opacity:1;filter:drop-shadow(0 0 10px #3ee6ff)}}
      @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#cc)">
    <rect width="800" height="340" fill="url(#bg)"/>
    <rect width="800" height="340" fill="url(#gd)"/>

    <!-- MATRIX RAIN (right side, behind chip) -->
    <g class="m" opacity=".35">
      <text x="540" y="0" class="mr mr1">01001</text>
      <text x="570" y="0" class="mr mr2">10110</text>
      <text x="600" y="0" class="mr mr3">11001</text>
      <text x="630" y="0" class="mr mr4">00111</text>
      <text x="660" y="0" class="mr mr5">10010</text>
      <text x="690" y="0" class="mr mr6">01110</text>
      <text x="720" y="0" class="mr mr7">11010</text>
      <text x="750" y="0" class="mr mr8">00101</text>
      <text x="555" y="0" class="mr mr9">1010</text>
      <text x="615" y="0" class="mr mr10">0110</text>
      <text x="675" y="0" class="mr mr11">1101</text>
      <text x="735" y="0" class="mr mr12">0011</text>
    </g>

    <!-- SCANLINE OVERLAY -->
    <rect class="sl" x="0" y="0" width="800" height="4" fill="#3ee6ff" fill-opacity=".04" rx="2"/>

    <!-- Ambient glows -->
    <circle cx="680" cy="140" r="140" fill="#3ee6ff" fill-opacity=".04"/>
    <circle cx="120" cy="240" r="160" fill="#00f5a0" fill-opacity=".025"/>

    <!-- Terminal chrome bar -->
    <rect width="800" height="42" fill="#0a1018"/>
    <line x1="0" y1="42" x2="800" y2="42" stroke="#182436" stroke-width="1"/>
    <line x1="0" y1="43" x2="300" y2="43" stroke="url(#ac)" stroke-width="2"/>
    <circle cx="22" cy="21" r="5" fill="#ff5f56" fill-opacity=".85"/>
    <circle cx="40" cy="21" r="5" fill="#ffbd2e" fill-opacity=".85"/>
    <circle cx="58" cy="21" r="5" fill="#27c93f" fill-opacity=".85"/>
    <text class="m" x="400" y="26" font-size="12" fill="#526477" text-anchor="middle">sparsh@quantum-core: ~/zero-black-boxes</text>
    <!-- Live status pill -->
    <g class="m" font-size="11">
      <rect x="680" y="10" width="100" height="22" rx="11" fill="#060a10" stroke="#182436" stroke-width="1"/>
      <circle class="lp" cx="694" cy="21" r="3.5" fill="#00f5a0"/>
      <text x="704" y="26" fill="#00f5a0" font-weight="600" letter-spacing=".5">ONLINE</text>
    </g>

    <!-- Prompt line -->
    <g class="m f1" font-size="14">
      <text x="40" y="82">
        <tspan fill="#3ee6ff" font-weight="700">❯</tspan>
        <tspan fill="#00f5a0" dx="6">sparsh@lab</tspan><tspan fill="#526477">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#526477">$</tspan>
        <tspan fill="#cbd5e1" dx="8">whoami --verbose --depth=silicon</tspan>
      </text>
    </g>

    <!-- GLITCHING NAME -->
    <g class="m f2 ng">
      <text x="40" y="154" font-size="56" font-weight="900" fill="url(#nm)" letter-spacing="2" filter="url(#gl)">SPARSH JAIN</text>
    </g>
    <!-- Glitch echo layers (subtle offset copies) -->
    <text class="m" x="42" y="154" font-size="56" font-weight="900" fill="#3ee6ff" letter-spacing="2" opacity=".06">SPARSH JAIN</text>
    <text class="m" x="38" y="155" font-size="56" font-weight="900" fill="#ff5f56" letter-spacing="2" opacity=".04">SPARSH JAIN</text>

    <!-- Typed tagline -->
    <g clip-path="url(#tm)">
      <text class="m" x="40" y="192" font-size="19" fill="#94a3b8" font-weight="500">Understand it. Take it apart. Build it better.</text>
    </g>

    <!-- Tag chips row -->
    <g class="m f3" font-size="10" font-weight="600">
      <rect x="40" y="216" width="98" height="22" rx="5" fill="#0d1520" stroke="#1e2d42" stroke-width="1"/>
      <text x="50" y="231" fill="#3ee6ff">⦿ B.TECH CSE</text>
      <rect x="146" y="216" width="126" height="22" rx="5" fill="#0d1520" stroke="#1e2d42" stroke-width="1"/>
      <text x="156" y="231" fill="#00f5a0">⦿ SECURITY ENG</text>
      <rect x="280" y="216" width="88" height="22" rx="5" fill="#0d1520" stroke="#1e2d42" stroke-width="1"/>
      <text x="290" y="231" fill="#a855f7">⦿ LOCAL AI</text>
      <rect x="376" y="216" width="90" height="22" rx="5" fill="#0d1520" stroke="#1e2d42" stroke-width="1"/>
      <text x="386" y="231" fill="#f59e0b">⦿ SILICON</text>
    </g>

    <!-- Second prompt + cursor -->
    <g class="m" font-size="14">
      <text x="40" y="276">
        <tspan fill="#3ee6ff" font-weight="700">❯</tspan>
        <tspan fill="#00f5a0" dx="6">~/lab</tspan><tspan fill="#526477">$</tspan>
        <tspan fill="#e2e8f0" dx="8">./keep-tinkering.sh</tspan>
      </text>
      <rect class="cu" x="244" y="262" width="10" height="18" rx="1" fill="#3ee6ff"/>
    </g>

    <!-- SILICON CHIP (right column) -->
    <g transform="translate(608,62)">
      <g stroke="#3ee6ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- input traces -->
        <path d="M-55 30H-15" stroke-opacity=".4"/>
        <path d="M-75 60H-15" stroke-opacity=".5"/>
        <path d="M-55 90H-15" stroke-opacity=".4"/>
        <path d="M-65 120H-15" stroke-opacity=".35"/>
        <path d="M-75 60L-95 40H-125" stroke-opacity=".25"/>
        <path d="M-65 120L-85 140H-115" stroke-opacity=".2"/>
        <!-- output traces -->
        <path d="M125 30H155" stroke-opacity=".4"/>
        <path d="M125 60H170" stroke-opacity=".5"/>
        <path d="M125 90H155" stroke-opacity=".4"/>
        <path d="M125 120H165" stroke-opacity=".35"/>
        <path d="M170 60L185 45V18" stroke-opacity=".25"/>
        <path d="M165 120L180 135V158" stroke-opacity=".2"/>
        <!-- top/bottom pins -->
        <path d="M25-12V5M55-12V5M85-12V5" stroke-opacity=".55"/>
        <path d="M25 145V162M55 145V162M85 145V162" stroke-opacity=".55"/>
      </g>
      <!-- pin nodes -->
      <g fill="#3ee6ff">
        <circle cx="-125" cy="40" r="2.5" fill-opacity=".6"/>
        <circle cx="-115" cy="140" r="2.5" fill-opacity=".6"/>
        <circle cx="185" cy="18" r="2.5" fill-opacity=".6"/>
        <circle cx="180" cy="158" r="2.5" fill-opacity=".6"/>
      </g>
      <!-- package -->
      <rect x="-5" y="10" width="120" height="130" rx="8" fill="url(#cg)" stroke="#3ee6ff" stroke-width="2" stroke-opacity=".85"/>
      <rect x="5" y="20" width="100" height="110" rx="5" fill="#070c14" stroke="#182436" stroke-width="1"/>
      <!-- silicon die -->
      <rect class="cp" x="20" y="38" width="70" height="74" rx="5" fill="#0c1320" stroke="#00f5a0" stroke-width="1.3" stroke-opacity=".85"/>
      <!-- die details -->
      <line x1="30" y1="58" x2="80" y2="58" stroke="#182436" stroke-width=".8"/>
      <line x1="30" y1="72" x2="80" y2="72" stroke="#182436" stroke-width=".8"/>
      <line x1="30" y1="86" x2="80" y2="86" stroke="#182436" stroke-width=".8"/>
      <line x1="55" y1="45" x2="55" y2="105" stroke="#182436" stroke-width=".8"/>
      <!-- center text -->
      <text class="m" x="55" y="70" font-size="24" font-weight="900" fill="#3ee6ff" text-anchor="middle" letter-spacing="1">SJ</text>
      <text class="m" x="55" y="86" font-size="7" font-weight="700" fill="#526477" text-anchor="middle" letter-spacing="2">REV-X86</text>
      <!-- corner markers -->
      <circle cx="28" cy="46" r="1.5" fill="#3ee6ff" fill-opacity=".7"/>
      <circle cx="82" cy="46" r="1.5" fill="#3ee6ff" fill-opacity=".7"/>
      <circle cx="28" cy="104" r="1.5" fill="#3ee6ff" fill-opacity=".7"/>
      <circle cx="82" cy="104" r="1.5" fill="#3ee6ff" fill-opacity=".7"/>
      <!-- pin labels -->
      <g class="m" font-size="7" fill="#526477" font-weight="700">
        <text x="1" y="33">CLK</text><text x="1" y="63">INT</text>
        <text x="1" y="93">RX</text><text x="1" y="123">TX</text>
        <text x="109" y="33" text-anchor="end">VCC</text><text x="109" y="63" text-anchor="end">GND</text>
        <text x="109" y="93" text-anchor="end">BUS</text><text x="109" y="123" text-anchor="end">ACK</text>
      </g>
    </g>

    <!-- Animated electron pulses -->
    <path id="e1" d="M460 122H590L608 122" stroke="#3ee6ff" stroke-opacity=".25" stroke-width="1" fill="none"/>
    <circle r="2.5" fill="#00f5a0"><animateMotion dur="3s" repeatCount="indefinite" begin=".5s"><mpath href="#e1"/></animateMotion></circle>
    <path id="e2" d="M480 310H660L680 290H795" stroke="#3ee6ff" stroke-opacity=".2" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <circle r="3" fill="#3ee6ff"><animateMotion dur="4s" repeatCount="indefinite" begin="1.5s"><mpath href="#e2"/></animateMotion></circle>
    <path id="e3" d="M5 310H80L100 290H200" stroke="#00f5a0" stroke-opacity=".15" stroke-width="1" fill="none" stroke-linejoin="round"/>
    <circle r="2" fill="#a855f7"><animateMotion dur="3.5s" repeatCount="indefinite" begin=".8s"><mpath href="#e3"/></animateMotion></circle>

    <!-- Bottom telemetry -->
    <g class="m" font-size="9" fill="#3b4a5f">
      <text x="40" y="322"><tspan fill="#3ee6ff">SYS</tspan>:OK · <tspan fill="#00f5a0">PHIL</tspan>:ZERO_BLACK_BOXES · <tspan fill="#a855f7">MODE</tspan>:DEEP_DIVE · <tspan fill="#f59e0b">ARCH</tspan>:FULL_STACK_TO_SILICON</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="798.5" height="338.5" rx="13.5" fill="none" stroke="#182436" stroke-width="1.5"/>
</svg>
