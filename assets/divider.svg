<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" role="img" aria-label="Cyber laser divider">
  <defs>
    <linearGradient id="div-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ee6ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3ee6ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#3ee6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3ee6ff" stop-opacity="0"/>
    </linearGradient>

    <style>
      .laser-pulse { animation: pulseLaser 2.8s ease-in-out infinite; }
      @keyframes pulseLaser { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; filter: drop-shadow(0 0 4px #00f5a0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Laser Beam -->
  <line x1="0" y1="12" x2="800" y2="12" stroke="url(#div-laser)" stroke-width="1.5"/>

  <!-- Center Diamond & Satellite Nodes -->
  <g fill="#00f5a0">
    <rect class="laser-pulse" x="394" y="6" width="12" height="12" rx="2" transform="rotate(45 400 12)"/>
    <circle cx="355" cy="12" r="2" fill="#3ee6ff" fill-opacity="0.6"/>
    <circle cx="445" cy="12" r="2" fill="#3ee6ff" fill-opacity="0.6"/>
    <circle cx="310" cy="12" r="1.5" fill="#3ee6ff" fill-opacity="0.35"/>
    <circle cx="490" cy="12" r="1.5" fill="#3ee6ff" fill-opacity="0.35"/>
    <circle cx="260" cy="12" r="1" fill="#3ee6ff" fill-opacity="0.2"/>
    <circle cx="540" cy="12" r="1" fill="#3ee6ff" fill-opacity="0.2"/>
  </g>
</svg>
