<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" role="img" aria-labelledby="tel-title tel-desc">
  <title id="tel-title">Sparsh Jain — System Diagnostics and Hardware Telemetry</title>
  <desc id="tel-desc">Fastfetch style terminal output showing operating system, hardware specs, engineering domains, and progress meters.</desc>
  <defs>
    <linearGradient id="tel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c12"/>
      <stop offset="60%" stop-color="#0c121b"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <linearGradient id="meter-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ee6ff"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>

    <linearGradient id="meter-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3ee6ff"/>
    </linearGradient>

    <pattern id="tel-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#182332" fill-opacity="0.45"/>
    </pattern>

    <clipPath id="tel-clip">
      <rect width="800" height="290" rx="12"/>
    </clipPath>

    <style>
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .lbl { fill: #3ee6ff; font-weight: 700; font-size: 12px; }
      .val { fill: #cbd5e1; font-size: 12px; }
      .val-hi { fill: #ffffff; font-weight: 600; font-size: 12px; }
      .sep { fill: #475569; font-size: 12px; }
      .sub-dim { fill: #64748b; font-size: 10px; }
      .pulse-ring { animation: pulseLogo 3s ease-in-out infinite; transform-origin: 105px 145px; }
      @keyframes pulseLogo {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#tel-clip)">
    <!-- Base Background -->
    <rect width="800" height="290" fill="url(#tel-bg)"/>
    <rect width="800" height="290" fill="url(#tel-dots)"/>

    <!-- Subtle Ambient Glow -->
    <circle cx="110" cy="145" r="90" fill="#3ee6ff" fill-opacity="0.05" filter="blur(30px)"/>
    <circle cx="700" cy="220" r="100" fill="#a855f7" fill-opacity="0.03" filter="blur(30px)"/>

    <!-- Window Top Header -->
    <rect width="800" height="34" fill="#0d141e"/>
    <line x1="0" y1="34" x2="800" y2="34" stroke="#1f2c3f" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="17" r="4.5" fill="#ff5f56" fill-opacity="0.8"/>
    <circle cx="36" cy="17" r="4.5" fill="#ffbd2e" fill-opacity="0.8"/>
    <circle cx="52" cy="17" r="4.5" fill="#27c93f" fill-opacity="0.8"/>
    
    <text class="mono" x="400" y="22" fill="#718295" font-size="11" text-anchor="middle">
      diagnostics@quantum-node ~ fastfetch --hardware-telemetry
    </text>

    <!-- LEFT COLUMN: Vector Graphic / ASCII-styled Hologram -->
    <g transform="translate(15, 45)">
      <!-- Radar Rings -->
      <circle class="pulse-ring" cx="95" cy="90" r="68" fill="none" stroke="#3ee6ff" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
      <circle cx="95" cy="90" r="50" fill="none" stroke="#1f2c3f" stroke-width="1.2"/>
      <circle cx="95" cy="90" r="32" fill="#0b1118" stroke="#00f5a0" stroke-width="1.5" stroke-opacity="0.75"/>

      <!-- Center Logo Glyph -->
      <text class="mono" x="95" y="97" font-size="20" font-weight="800" fill="#3ee6ff" text-anchor="middle">SJ</text>

      <!-- Cardinal Axes -->
      <line x1="95" y1="12" x2="95" y2="30" stroke="#3ee6ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="95" y1="150" x2="95" y2="168" stroke="#3ee6ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="17" y1="90" x2="35" y2="90" stroke="#3ee6ff" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="155" y1="90" x2="173" y2="90" stroke="#3ee6ff" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Crosshair corners -->
      <path d="M40 35 H55 M40 35 V50" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
      <path d="M150 35 H135 M150 35 V50" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
      <path d="M40 145 H55 M40 145 V130" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
      <path d="M150 145 H135 M150 145 V130" stroke="#00f5a0" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>

      <!-- Target Node Label -->
      <text class="mono sub-dim" x="95" y="186" text-anchor="middle" letter-spacing="1">NODE: SP-X01</text>

      <!-- Terminal Palette Color Chips -->
      <g transform="translate(18, 204)">
        <rect x="0" y="0" width="16" height="12" rx="2" fill="#0f1722"/>
        <rect x="20" y="0" width="16" height="12" rx="2" fill="#3ee6ff"/>
        <rect x="40" y="0" width="16" height="12" rx="2" fill="#00f5a0"/>
        <rect x="60" y="0" width="16" height="12" rx="2" fill="#a855f7"/>
        <rect x="80" y="0" width="16" height="12" rx="2" fill="#f59e0b"/>
        <rect x="100" y="0" width="16" height="12" rx="2" fill="#ec4899"/>
        <rect x="120" y="0" width="16" height="12" rx="2" fill="#60a5fa"/>
        <rect x="140" y="0" width="16" height="12" rx="2" fill="#e2e8f0"/>
      </g>
    </g>

    <!-- Vertical Divider Line -->
    <line x1="215" y1="46" x2="215" y2="276" stroke="#1c2838" stroke-width="1"/>

    <!-- RIGHT COLUMN: Fastfetch Telemetry Data -->
    <g class="mono" transform="translate(235, 46)">
      <!-- Line 0: Header / OS User -->
      <text x="0" y="20" font-size="14" font-weight="700">
        <tspan fill="#3ee6ff">sparsh</tspan><tspan fill="#64748b">@</tspan><tspan fill="#00f5a0">quantum-node</tspan>
      </text>
      <line x1="0" y1="26" x2="525" y2="26" stroke="#1f2c3f" stroke-width="1"/>

      <!-- Line 1: Role -->
      <text x="0" y="48">
        <tspan class="lbl">ROLE</tspan>
        <tspan class="sep" dx="72">❯</tspan>
        <tspan class="val-hi" dx="8">Systems &amp; Security Engineer (B.Tech CSE)</tspan>
      </text>

      <!-- Line 2: Stack -->
      <text x="0" y="70">
        <tspan class="lbl">CORE TECH</tspan>
        <tspan class="sep" dx="37">❯</tspan>
        <tspan class="val" dx="8">Python, TypeScript, FastAPI, React, SQLite, Vite</tspan>
      </text>

      <!-- Line 3: Security & Analysis -->
      <text x="0" y="92">
        <tspan class="lbl">SECURITY</tspan>
        <tspan class="sep" dx="45">❯</tspan>
        <tspan class="val" dx="8">Android APK Auditing, AST Parsing, Deterministic Risk Models</tspan>
      </text>

      <!-- Line 4: Systems / Firmware -->
      <text x="0" y="114">
        <tspan class="lbl">LOW-LEVEL</tspan>
        <tspan class="sep" dx="37">❯</tspan>
        <tspan class="val" dx="8">OpenWrt Firmware, Wireless Tuning, Linux Kernels, Shell</tspan>
      </text>

      <!-- Line 5: Hardware & Silicon -->
      <text x="0" y="136">
        <tspan class="lbl">HARDWARE</tspan>
        <tspan class="sep" dx="40">❯</tspan>
        <tspan class="val" dx="8">Arduino, 7400-Series TTL Logic, Breadboard Circuitry</tspan>
      </text>

      <!-- Line 6: Local AI -->
      <text x="0" y="158">
        <tspan class="lbl">LOCAL AI</tspan>
        <tspan class="sep" dx="47">❯</tspan>
        <tspan class="val" dx="8">Ollama, GGUF Quantization Latency, Local-First RAG</tspan>
      </text>

      <!-- Line 7: Progress Meter: Curiosity / Black Box Resistance -->
      <text x="0" y="184">
        <tspan class="lbl">CURIOSITY</tspan>
        <tspan class="sep" dx="33">❯</tspan>
      </text>
      <!-- Meter Bar 1 -->
      <g transform="translate(110, 173)">
        <rect width="250" height="12" rx="3" fill="#0f1722" stroke="#1f2c3f" stroke-width="1"/>
        <rect width="250" height="12" rx="3" fill="url(#meter-cyan)"/>
        <text class="mono" x="260" y="10" fill="#00f5a0" font-size="10" font-weight="700">100% [INFINITE]</text>
      </g>

      <!-- Line 8: Progress Meter: Deterministic Rule Auditing -->
      <text x="0" y="212">
        <tspan class="lbl">AUDIT ENGINE</tspan>
        <tspan class="sep" dx="10">❯</tspan>
      </text>
      <!-- Meter Bar 2 -->
      <g transform="translate(110, 201)">
        <rect width="250" height="12" rx="3" fill="#0f1722" stroke="#1f2c3f" stroke-width="1"/>
        <rect width="220" height="12" rx="3" fill="url(#meter-violet)"/>
        <text class="mono" x="260" y="10" fill="#3ee6ff" font-size="10" font-weight="700">88% [ZERO BLACK BOX]</text>
      </g>
    </g>
  </g>

  <!-- Outer Glass Border -->
  <rect x="0.75" y="0.75" width="798.5" height="288.5" rx="11.5" fill="none" stroke="#1f2c3f" stroke-width="1.5"/>
</svg>
